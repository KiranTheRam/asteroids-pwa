# Static-site server for the Asteroids PWA.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # security + correctness
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The service worker and entry document must always revalidate so a new
    # build actually reaches clients (the SW itself precaches everything else).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # nginx's default mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else (JS modules, CSS, icons). Return 404 for misses so the
    # service worker's offline handling behaves; do not rewrite to index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
